<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LUMEOS 28.2</title>
<style>
:root{--sp:cubic-bezier(.22,1,.36,1);--w:min(80vw,calc(82dvh/1.75))}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%;background:#000;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;color:#fff;touch-action:none}
body{display:grid;place-items:center}
button,input,textarea{font:inherit;color:inherit;border:0;outline:0;background:none}
#phone{position:relative;width:var(--w);height:calc(var(--w)*1.75);container-type:size;border-radius:calc(var(--w)*.12);overflow:hidden;isolation:isolate;background:#05060b;font-size:3.6cqw;box-shadow:0 0 0 calc(var(--w)*.01) #1c1c1f,0 0 0 calc(var(--w)*.016) #3a3a3e,0 30px 80px rgba(0,0,0,.7)}
#wall{position:absolute;inset:-14%;z-index:1;background:radial-gradient(circle at 20% 16%,rgba(68,46,168,.8),transparent 48%),radial-gradient(circle at 84% 22%,rgba(12,112,182,.72),transparent 50%),radial-gradient(circle at 78% 84%,rgba(168,32,92,.64),transparent 52%),radial-gradient(circle at 16% 78%,rgba(30,52,132,.7),transparent 54%),linear-gradient(165deg,#070914,#04050b 52%,#130822);filter:blur(22px) saturate(135%)}
#glow{position:absolute;inset:0;z-index:5;background:radial-gradient(circle,rgba(255,250,232,.4),transparent 72%);opacity:0;pointer-events:none;transition:opacity .3s}
#glow.on{opacity:1}
#dim{position:absolute;inset:0;z-index:98;background:#000;opacity:0;pointer-events:none}
#sbar{position:absolute;top:0;left:0;right:0;height:13cqw;z-index:90;display:flex;justify-content:space-between;align-items:center;padding:1.5cqw 8cqw 0 9.5cqw;font-weight:600;font-size:4.1cqw;pointer-events:none;transition:color .3s}
#sbar.dk{color:#000}
#sbar span:last-child{display:flex;gap:1.4cqw;align-items:center}
#isl{position:absolute;z-index:95;top:3cqw;left:50%;transform:translateX(-50%);width:29cqw;height:8.4cqw;border-radius:5cqw;background:#000}
#hb{position:absolute;z-index:99;bottom:0;left:50%;transform:translateX(-50%);width:100%;height:6cqw;display:flex;justify-content:center;align-items:flex-end;padding-bottom:1.6cqw}
#hb i{width:34cqw;height:1.3cqw;border-radius:2cqw;background:#fff;transition:background .3s}
#hb.dk i{background:#000}

/* HOME */
#home{position:absolute;inset:0;z-index:10;transition:transform .55s var(--sp),filter .55s var(--sp),opacity .55s}
#home.rec{transform:scale(.9);filter:blur(12px) brightness(.7)}
#pager{position:absolute;inset:0;width:200%;display:flex;transition:transform .5s var(--sp)}
#home.lib #pager{transform:translateX(-50%)}
.pg{width:50%;height:100%;padding:14cqw 6.9cqw 0}
.grid{display:grid;grid-template-columns:repeat(4,15.3cqw);justify-content:space-between;row-gap:4.4cqw}
.wg{grid-column:span 2;display:flex;flex-direction:column;align-items:center;gap:1.4cqw;font-size:2.9cqw;font-weight:500;text-shadow:0 1px 4px rgba(0,0,0,.6)}
.wb{width:100%;aspect-ratio:1;border-radius:6.8cqw;padding:4.2cqw;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 2cqw 6cqw rgba(0,0,0,.3),inset 0 0 0 .25cqw rgba(255,255,255,.12);text-shadow:none}
.app{display:flex;flex-direction:column;align-items:center;gap:1.3cqw;font-size:2.95cqw;font-weight:500;text-shadow:0 1px 4px rgba(0,0,0,.6);white-space:nowrap}
.icw{position:relative;width:15.3cqw}
.ic{width:100%;aspect-ratio:1;border-radius:22.5%;overflow:hidden;position:relative;box-shadow:0 1.2cqw 3cqw rgba(0,0,0,.35)}
.ic svg{width:100%;height:100%;display:block}
.ic::after{content:"";position:absolute;inset:0;background:linear-gradient(160deg,rgba(255,255,255,.18),transparent 45%);pointer-events:none}
.bd{position:absolute;top:-1.8cqw;right:-1.8cqw;min-width:5.6cqw;height:5.6cqw;padding:0 1.6cqw;border-radius:3cqw;background:#ff3b30;font-size:3.3cqw;font-weight:600;display:grid;place-items:center;box-shadow:0 .5cqw 1.5cqw rgba(0,0,0,.4)}
#dock{position:absolute;left:2.8cqw;right:2.8cqw;bottom:2.4cqw;height:24.6cqw;border-radius:8.4cqw;background:rgba(60,62,72,.45);backdrop-filter:blur(30px) saturate(170%);display:flex;justify-content:space-around;align-items:center;padding:0 1cqw;transition:opacity .4s}
.pill{position:absolute;left:50%;bottom:28.8cqw;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:2.4cqw;transition:opacity .4s}
.pill button{padding:1.5cqw 4cqw;border-radius:6cqw;background:rgba(70,72,84,.5);backdrop-filter:blur(20px);font-size:3.3cqw;font-weight:500;display:flex;gap:1.4cqw;align-items:center}
.dots{display:flex;gap:1.8cqw}.dots i{width:1.8cqw;height:1.8cqw;border-radius:50%;background:rgba(255,255,255,.35)}.dots i.on{background:#fff}
#home.lib #dock,#home.lib .pill{opacity:0}
#lib{height:100%;overflow-y:auto;padding-bottom:12cqw;touch-action:pan-y}
#lib .sbx{display:flex;gap:2cqw;align-items:center;padding:2.8cqw 3.5cqw;border-radius:3.6cqw;background:rgba(70,72,84,.55);backdrop-filter:blur(20px);color:rgba(255,255,255,.7);margin-bottom:4.4cqw}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:4.6cqw 4.8cqw}
.fold{display:flex;flex-direction:column;gap:1.6cqw;align-items:center;font-size:2.95cqw;font-weight:500}
.fcard{width:100%;aspect-ratio:1;border-radius:6.4cqw;background:rgba(60,62,72,.45);backdrop-filter:blur(26px);padding:3.2cqw;display:grid;grid-template-columns:1fr 1fr;gap:2.6cqw}
.fcard .app{gap:0}.fcard .icw{width:100%}
/* reveal after unlock */
#home.pre .app,#home.pre .wg,#home.pre #dock,#home.pre .pill{opacity:0}
#home.reveal .app,#home.reveal .wg,#home.reveal #dock,#home.reveal .pill{animation:rise .75s var(--sp) backwards;animation-delay:calc(var(--i,0)*38ms + 120ms)}
@keyframes rise{from{opacity:0;transform:translateY(5cqw) scale(.8);filter:blur(8px)}}

/* LOCK */
#lock{position:absolute;inset:0;z-index:70;padding:20cqw 6cqw 8cqw;display:flex;flex-direction:column;align-items:center;background:linear-gradient(175deg,rgba(10,12,24,.55),rgba(6,7,15,.8));backdrop-filter:blur(22px) saturate(150%);transform-origin:50% 60%}
.clk{text-align:center;margin-bottom:5cqw}
.clk .d{font-size:4.8cqw;font-weight:600;opacity:.9}.clk .tt{font-size:22cqw;font-weight:700;letter-spacing:-.5cqw;line-height:1.02}
.nt{width:100%;display:flex;flex-direction:column;gap:2.4cqw;margin-bottom:auto}
.n{background:rgba(52,56,72,.6);backdrop-filter:blur(24px);border-radius:5.6cqw;padding:3.4cqw 4cqw;font-size:3.5cqw;line-height:1.35}
.n small{display:flex;justify-content:space-between;color:rgba(255,255,255,.6);font-size:3cqw;margin-bottom:.8cqw}
.n b{display:block;font-weight:600}
.lrow{width:100%;display:flex;justify-content:space-between;padding:0 4cqw;margin:4cqw 0}
.rb{width:12.6cqw;height:12.6cqw;border-radius:50%;background:rgba(52,56,72,.6);backdrop-filter:blur(24px);display:grid;place-items:center}
.rb.on{background:#fff;color:#111}
.hint{font-size:3.2cqw;opacity:.7;margin-bottom:1cqw}

/* PANELS (CC / NC) */
.panel{position:absolute;inset:0;--p:0;backdrop-filter:blur(calc(var(--p)*30px)) saturate(150%);background:rgba(8,10,20,calc(var(--p)*.55));pointer-events:none;display:flex;flex-direction:column;align-items:center}
.panel.anim,.panel.anim>*{transition:opacity .5s var(--sp),backdrop-filter .5s var(--sp),background .5s,transform .55s var(--sp)}
.panel>.in{width:100%;flex:1;display:flex;flex-direction:column;align-items:center}
#cc{z-index:62;padding:13cqw 0 5cqw}#nc{z-index:60;padding:19cqw 6cqw 8cqw}
.ccg{display:grid;grid-template-columns:repeat(4,17cqw);grid-auto-rows:17cqw;gap:2.5cqw;margin-top:10cqw}
.t{border-radius:5.6cqw;background:rgba(80,84,98,.55);backdrop-filter:blur(20px);display:grid;place-items:center;transition:background .25s,color .25s,transform .2s}
.t:active{transform:scale(.94)}
.t.on{background:#fff;color:#111}
.cn{grid-column:1/3;grid-row:1/3;padding:2.4cqw;display:grid;grid-template-columns:1fr 1fr;gap:2.4cqw}
.cn button{border-radius:50%;background:rgba(120,124,138,.5);display:grid;place-items:center;transition:background .25s}
.cn button.g{background:#30d158}.cn button.b{background:#0a84ff}.cn button.o{background:#ff9f0a}
.md{grid-column:3/5;grid-row:1/3;padding:3.5cqw;display:flex;flex-direction:column;justify-content:space-between}
.sl{position:relative;overflow:hidden;grid-row:3/5;touch-action:none}
.sl>div{position:absolute;left:0;right:0;bottom:0;background:#fff}
.sl>span{position:absolute;bottom:3.4cqw;left:50%;transform:translateX(-50%);color:#8e8e93;pointer-events:none}
.ccbar{width:75.5cqw;display:flex;justify-content:space-between}
.ccbar .t{width:8.6cqw;height:8.6cqw;border-radius:50%}

.ic{box-shadow:0 1.2cqw 3cqw rgba(0,0,0,.35),inset 0 0 0 .25cqw rgba(255,255,255,.1)}
.ccbar{width:68cqw}.ccc{width:68cqw;margin:auto 0}
.cg{display:grid;grid-template-columns:repeat(4,1fr);gap:2.4cqw}
.ct{border:.3cqw solid rgba(255,255,255,.16);background:rgba(52,55,66,.62);backdrop-filter:blur(20px);border-radius:5cqw;display:grid;place-items:center}
.ct.on{background:rgba(255,255,255,.95);color:#111}.ct.red.on{color:#ff375f}
.s1{aspect-ratio:1}.s2{grid-column:span 2;aspect-ratio:1}
.cbx{padding:2.2cqw;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:2cqw}
.cbx>button{border-radius:3.4cqw;background:rgba(255,255,255,.15);display:grid;place-items:center}
.cbx>.o{background:#ff9f0a}.cbx>.g{background:#30d158}.cbx>.b{background:#0a84ff}
.cq{display:grid;grid-template-columns:1fr 1fr;gap:.8cqw}.cq>button{border-radius:1.8cqw;background:rgba(255,255,255,.16);display:grid;place-items:center}.cq>.on{background:#fff;color:#111}
.mdb{padding:2.6cqw;display:flex;flex-direction:column;justify-content:space-between}
.mid{grid-column:span 2;display:grid;grid-template-columns:1fr 1fr;gap:2.4cqw}.mid .ct{border-radius:4.4cqw}
.slp{position:relative;overflow:hidden;touch-action:none}.sf{position:absolute;left:0;right:0;bottom:0;background:#fff}.si2{position:absolute;bottom:2.8cqw;left:50%;transform:translateX(-50%);color:#8e8e93;pointer-events:none}
.shz{grid-column:span 2;aspect-ratio:2/1;display:flex;gap:2cqw;justify-content:center}
.bsq{grid-column:span 2;aspect-ratio:1.12;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;padding:3cqw}
.bdg{width:9cqw;height:9cqw;border-radius:2.8cqw;background:rgba(255,255,255,.16);display:grid;place-items:center}.bsq.on .bdg{background:rgba(0,0,0,.1)}
/* APP STAGE */
#stage{position:absolute;z-index:40;display:none;overflow:hidden;background:#000;transition:left .55s var(--sp),top .55s var(--sp),width .55s var(--sp),height .55s var(--sp),border-radius .55s var(--sp),background .4s,transform .55s var(--sp)}
#stage .body{position:absolute;left:0;top:0;overflow-y:auto;opacity:0;padding:17cqw 5cqw 14cqw;transition:opacity .3s;touch-action:pan-y}
#stage.show .body{opacity:1;transition:opacity .35s .18s}
#stage.light{color:#111}
.card{background:#1c1c1e;border-radius:4.4cqw;padding:2cqw 4cqw;margin-bottom:4cqw}
#stage.light .card{background:#fff}
.row{display:flex;justify-content:space-between;align-items:center;padding:3cqw 0;border-bottom:.25cqw solid rgba(128,128,128,.25);font-size:3.9cqw}.row:last-child{border:0}
.row span:last-child{color:#8e8e93}
h1{font-size:8cqw;margin-bottom:4cqw}
.cs{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3.5cqw;text-align:center;padding-bottom:12cqw}
.cs .ic{width:26cqw}
.tag{padding:1.2cqw 3.6cqw;border-radius:4cqw;background:rgba(10,132,255,.2);border:.25cqw solid rgba(10,132,255,.5);color:#64d2ff;font-size:3.2cqw;font-weight:700}
.ck{display:grid;grid-template-columns:repeat(4,1fr);gap:2.6cqw}
.ck button{aspect-ratio:1;border-radius:50%;background:#333;font-size:7cqw;display:grid;place-items:center}
.ck .f{background:#a5a5a5;color:#000}.ck .o{background:#ff9f0a}
.dial{display:grid;grid-template-columns:repeat(3,19cqw);gap:3cqw;justify-content:center}
.dial button{height:19cqw;border-radius:50%;background:#2c2c2e;font-size:8cqw}

/* SWITCHER / SPOTLIGHT */
#swt,#spot{position:absolute;inset:0;z-index:50;display:none;background:rgba(10,12,20,.7);backdrop-filter:blur(34px) saturate(170%);flex-direction:column;align-items:center;justify-content:space-between;padding:18cqw 0 16cqw}
#swt.open,#spot.open{display:flex;animation:fade .35s var(--sp)}
@keyframes fade{from{opacity:0}}
.sw{position:relative;width:100%;height:92cqw}
.sw::-webkit-scrollbar{display:none}
.scard{position:absolute;left:50%;top:50%;margin:-39cqw 0 0 -26cqw;width:52cqw;height:78cqw;transition:transform .55s var(--sp),opacity .4s;border-radius:7cqw;display:flex;flex-direction:column;justify-content:space-between;padding:4cqw;box-shadow:0 5cqw 12cqw rgba(0,0,0,.5);font-weight:600}
.scard .ic{width:13cqw;align-self:center;margin-bottom:6cqw}
.btn{padding:2.6cqw 6cqw;border-radius:5cqw;background:rgba(255,255,255,.16);font-weight:600;font-size:3.6cqw}
#spot{justify-content:flex-start;gap:4cqw;padding:18cqw 5cqw}
#spot input{width:100%;padding:3cqw 4cqw;border-radius:4cqw;background:rgba(255,255,255,.16);font-size:4cqw}
#sl{width:100%;background:rgba(255,255,255,.1);border-radius:4.4cqw;padding:0 4cqw;max-height:90cqw;overflow:auto}
.cbx{place-items:stretch}
.ct{clip-path:inset(0 round 5cqw);-webkit-appearance:none}.mid .ct{clip-path:inset(0 round 4.4cqw)}.ccbar .ct{clip-path:inset(0 round 2.8cqw)}
.cbx>button{clip-path:inset(0 round 3.4cqw);-webkit-appearance:none}.cq>button{clip-path:inset(0 round 1.8cqw)}.rb{clip-path:circle(50%)}
.ct:active,.cbx>button:active,.cq>button:active{filter:brightness(1.3)}
.ccbar{width:74cqw}.ccc{width:74cqw}#sl{touch-action:pan-y}
.panel{backdrop-filter:none;-webkit-backdrop-filter:none;background:none}
.panel::before{content:"";position:absolute;inset:0;background:rgba(8,10,20,.55);backdrop-filter:blur(30px) saturate(150%);-webkit-backdrop-filter:blur(30px) saturate(150%);opacity:var(--p)}
.panel.anim,.panel.anim>*{transition:none}.panel.anim::before{transition:opacity .45s ease}
.panel>.in{position:relative;z-index:1}.panel [data-s]{will-change:transform,opacity}
.panel .n,.panel .rb{backdrop-filter:none;-webkit-backdrop-filter:none}
#cc{padding:11cqw 0 4cqw}
.cb{width:72cqw;display:flex;justify-content:space-between;align-items:center}
.cbt{width:6.6cqw;height:6.6cqw;border-radius:50%;background:rgba(110,110,118,.5);display:grid;place-items:center}
.cr{width:74cqw;margin-top:3.4cqw;display:flex;justify-content:space-between;align-items:center;font-size:3.9cqw;font-weight:600}.cr span{display:flex;align-items:center;gap:1.3cqw}
.cw{width:72cqw;position:relative;margin:auto 0}
.cgr{display:grid;grid-template-columns:repeat(4,15.5cqw);grid-auto-rows:15.5cqw;gap:3.32cqw}
.k{position:relative;overflow:hidden;display:grid;place-items:center;background:rgba(104,104,112,.46);box-shadow:inset 0 .25cqw .4cqw rgba(255,255,255,.2);-webkit-appearance:none;color:#fff;border:0}
.k:active{filter:brightness(1.25)}
.k.c{border-radius:50%;clip-path:circle(50%)}
.k.sq{border-radius:6.8cqw;clip-path:inset(0 round 6.8cqw)}
.k.pill{border-radius:8cqw;clip-path:inset(0 round 8cqw);display:flex;justify-content:flex-start;gap:2.6cqw;padding-left:4.2cqw}
.k.on{background:#f6f6f6;color:#111}.k.wf.on{color:#3b8cff}.k.rt.on{color:#ff6b6b}.k.rc.on{color:#ff453a}.k.lp.on{background:#ffd60a}
.k.cn{padding:3.1cqw;grid-template:1fr 1fr/1fr 1fr;gap:3.1cqw;place-items:stretch}
.ob,.qb{border-radius:50%;background:rgba(255,255,255,.17);display:grid;place-items:center;color:#fff}
.ob.o{background:#ff9f0a}.ob.g{background:#30d158}.ob.b{background:#3b8cff}
.q4{display:grid;grid-template:1fr 1fr/1fr 1fr;gap:.9cqw;padding:.2cqw}.qb.on{background:#f2f2f2;color:#111}
.k.md{padding:3.4cqw;display:flex;flex-direction:column;justify-content:space-between;align-items:stretch}
.sl2{border-radius:7.75cqw;clip-path:inset(0 round 7.75cqw);background:rgba(70,70,76,.75);display:block;touch-action:none}
.sf2{position:absolute;left:0;right:0;bottom:0;background:#f8f8f8}
.si3{position:absolute;bottom:3.6cqw;left:50%;transform:translateX(-50%);pointer-events:none;display:flex}
.k.bx{padding:3.4cqw;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start}
.bg3{width:9cqw;height:9cqw;border-radius:50%;background:rgba(255,255,255,.17);display:grid;place-items:center}.bg3.s{border-radius:2cqw;width:7.4cqw;height:7.4cqw}
.k.bx b{font-size:3.4cqw;font-weight:500;display:flex;align-items:center;gap:1cqw}.k.on .bg3{background:rgba(0,0,0,.1)}
.ind{position:absolute;right:-10cqw;top:44%;display:flex;flex-direction:column;gap:5.2cqw;align-items:center;color:rgba(255,255,255,.5)}
*{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-user-drag:none}textarea,input{-webkit-user-select:text;user-select:text}
.pill button{display:none}.pill{bottom:28cqw}
#lock{padding-bottom:8cqw}.lrow{margin:0 0 2.6cqw}.hint{position:absolute;left:0;right:0;bottom:4.4cqw;margin:0;text-align:center;pointer-events:none}
#stage #ico{position:absolute;inset:0;z-index:2;pointer-events:none;will-change:opacity}
:root{--w:min(80vw,calc(82dvh/1.925));--sp2:cubic-bezier(.32,.72,0,1)}
#phone{height:calc(var(--w)*1.925)}
.pg{padding-top:16cqw}.grid{row-gap:7cqw}
/* app open/close */
#home{transition:transform .5s var(--sp2),opacity .5s}#home.rec{transform:scale(.92);filter:none}
#veil{position:absolute;inset:0;z-index:30;pointer-events:none;opacity:0;background:rgba(0,0,0,.28);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);transition:opacity .45s ease}
#home.rec+#veil{opacity:1}
#stage{transition:left .5s var(--sp2),top .5s var(--sp2),width .5s var(--sp2),height .5s var(--sp2),border-radius .5s var(--sp2),transform .5s var(--sp2);box-shadow:0 2cqw 8cqw rgba(0,0,0,.4)}
.app:active .ic svg{transform:scale(.88);transition:transform .12s}
/* liquid glass */
.k,.cbt,.panel .n,.panel .rb{background:linear-gradient(150deg,rgba(255,255,255,.2),rgba(255,255,255,.06) 45%,rgba(255,255,255,.12));box-shadow:inset 0 0 0 .3cqw rgba(255,255,255,.16),inset .3cqw .5cqw .6cqw -.1cqw rgba(255,255,255,.5),inset -.3cqw -.5cqw .6cqw -.1cqw rgba(255,255,255,.18)}
.k.on{background:rgba(255,255,255,.92)}.k.lp.on{background:rgba(255,214,10,.95)}
.k.sl2{background:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,.06))}.sf2{background:rgba(255,255,255,.95)}
